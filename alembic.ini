# Alembic reads this for the CLI (`alembic upgrade head`, `alembic revision --autogenerate -m "..."`). The service itself
# runs the same migrations at startup through app/database/migrate.py. The database URL is not set here: migrations/env.py takes
# it from the application settings (MEDREASON_DATABASE_URL), so there is one place it comes from.
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
